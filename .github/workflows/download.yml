name: OneDrive Personal Crack Downloader

on:
  workflow_dispatch: # 支持网页端一键点击运行

jobs:
  crack_download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download Real Physical Stream
      run: |
        mkdir -p ./dataset_download
        cd ./dataset_download
        
        echo "正在调用由 F12 拦截到的微软个人版专属直连管道..."
        
        # 核心改变：直接请求微软个人版底层不带任何反爬验证的实际内容吐出接口（/root/content）
        # 使用 -L 允许强力跟踪重定向，--retry 5 应对网络波动
        curl -L --retry 5 -A "Mozilla/5.0" \
          -o sc_depth_dataset.zip \
          "https://onedrive.com"
        
        echo "======================================"
        echo "下载尝试完成！正在对物理文件进行大小与格式校验："
        ls -lh sc_depth_dataset.zip
        file sc_depth_dataset.zip
        echo "======================================"
        cd ..

    - name: Upload Dataset to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v13.0.0-final-crack
        name: SC-Depth Preprocessed Dataset (OneDrive Personal Solved)
        draft: false
        prerelease: false
        files: ./dataset_download/sc_depth_dataset.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
