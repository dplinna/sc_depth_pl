name: Auto Fetch SC-Depth Dataset

on:
  workflow_dispatch: # 手动点击运行

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Download via OneDrive API Link
      run: |
        mkdir -p ./dataset_download
        cd ./dataset_download
        
        echo "正在使用开源社区 OneDrive 直链接口进行强制拖取..."
        
        # 这一步通过公开的转换服务，直接把你的短链转化为能直接吐出数据流的地址
        # -L 强制追踪所有重定向，--retry 5 网络波动重试
        curl -L --retry 5 -o sc_depth_dataset.zip "https://api.moe"
        
        echo "======================================"
        echo "下载尝试完成！正在验证文件是否真实存在："
        ls -lh sc_depth_dataset.zip
        echo "======================================"

    - name: Upload Dataset to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v4.0.0-sc-depth
        name: SC-Depth Preprocessed Dataset Fixed
        draft: false
        prerelease: false
        files: ./dataset_download/sc_depth_dataset.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
