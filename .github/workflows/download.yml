name: Auto Fetch SC-Depth Dataset (Final Hotfix)

on:
  workflow_dispatch: # 手动一键运行

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Advanced Downloader
      run: pip install requests

    - name: Run Python Anti-Bot Bypass and Download
      run: |
        mkdir -p ./dataset_download
        
        python -c '
        import os, base64, requests

        # 1. 填入正确的原始链接
        share_url = "https://1drv.ms"
        
        # 2. 严格执行符合微软 Microsoft Graph 规范的 Base64 编码
        encoded_url = base64.b64encode(share_url.encode("utf-8")).decode("utf-8")
        safe_encoded = "u!" + encoded_url.replace("/", "_").replace("+", "-").rstrip("=")
        
        # 【核心修复】严格规范域名为 api.onedrive.com，并在安全字符串前加上缺失的斜杠与路由
        api_url = f"https://onedrive.com{safe_encoded}/root"
        
        print(f"正在向微软核心服务器申请临时数据管道... API地址: {api_url}")
        
        headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
        res = requests.get(api_url, headers=headers).json()
        
        if "error" in res:
            print("微软接口返回错误:", res["error"]["message"])
            exit(1)
            
        download_url = res.get("@microsoft.graph.downloadUrl")
        if not download_url:
            print("未能直接捕获下载流，正在尝试从子项中搜寻...")
            children_url = f"{api_url}/children"
            children_res = requests.get(children_url, headers=headers).json()
            # 兼容多文件目录格式，提取第一个有效子项的物理流
            download_url = children_res["value"][0]["@microsoft.graph.downloadUrl"]
            
        print("成功建立安全传输通道，正在全速拉取物理数据流...")
        
        # 流式下载，防止超大文件断流
        with requests.get(download_url, stream=True) as r:
            r.raise_for_status()
            with open("./dataset_download/sc_depth_dataset.zip", "wb") as f:
                for chunk in r.iter_content(chunk_size=1024*1024): # 1MB 缓存块高效读写
                    f.write(chunk)
                    
        print("传输完成！已成功下载真实物理压缩包。")
        '
        
        echo "======================================"
        echo "正在校验下载到的真实文件属性："
        ls -lh ./dataset_download/sc_depth_dataset.zip
        file ./dataset_download/sc_depth_dataset.zip
        echo "======================================"

    - name: Upload Real Dataset to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v7.0.0-verified-dataset
        name: SC-Depth Preprocessed Dataset (Hotfix Pass)
        draft: false
        prerelease: false
        files: ./dataset_download/sc_depth_dataset.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
