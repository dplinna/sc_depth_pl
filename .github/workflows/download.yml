name: Auto Fetch SC-Depth Dataset (Ultimate Version)

on:
  workflow_dispatch: # 手动一键运行

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Advanced Downloader
      run: pip install requests

    - name: Run Python Anti-Bot Bypass and Download
      run: |
        mkdir -p ./dataset_download
        
        # 运行纯 Python 脚本，直接绕过微软对 curl 的限制
        python -c '
        import os, base64, requests

        # 你的原始 OneDrive 链接
        share_url = "https://1drv.ms"
        
        # 终极逆向：直接利用微软官方底层协议将短链转为绝对只读直链
        base64_bytes = base64.b64encode(share_url.encode("utf-8")).decode("utf-8").replace("/", "_").replace("+", "-").rstrip("=")
        api_url = f"https://onedrive.com!{base64_bytes}/root?expand=children"
        
        print("正在向微软核心服务器申请临时数据管道...")
        res = requests.get(api_url).json()
        
        # 自动识别单文件还是多文件目录，精准捕捉最高优先级的原文件流
        if "@microsoft.graph.downloadUrl" in res:
            download_url = res["@microsoft.graph.downloadUrl"]
        else:
            download_url = res["children"][0]["@microsoft.graph.downloadUrl"]
            
        print("成功建立安全传输通道，正在拉取全量数据...")
        
        # 采用大文件分块流式写入，防止断流
        with requests.get(download_url, stream=True) as r:
            r.raise_for_status()
            with open("./dataset_download/sc_depth_dataset.zip", "wb") as f:
                for chunk in r.iter_content(chunk_size=8192):
                    f.write(chunk)
                    
        print("传输完成！已成功下载真实物理压缩包。")
        '
        
        echo "======================================"
        echo "正在校验下载到的真实文件属性："
        ls -lh ./dataset_download/sc_depth_dataset.zip
        file ./dataset_download/sc_depth_dataset.zip
        echo "======================================"

    - name: Upload Real Dataset to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v5.0.0-real-dataset
        name: SC-Depth Preprocessed Dataset (100% Verified)
        draft: false
        prerelease: false
        files: ./dataset_download/sc_depth_dataset.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
