name: Pure Browser Automation Downloader

on:
  workflow_dispatch: # 手动一键运行

jobs:
  bypass_and_download:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Puppeteer
      run: npm install puppeteer

    - name: Run Headless Browser to Catch Stream
      run: |
        mkdir -p ./dataset_download
        
        # 编写一个自动化脚本，让海外服务器真的像人一样打开网页并拦截真实的底层下载流
        cat << 'EOF' > spider.js
        const puppeteer = require('puppeteer');
        const fs = require('fs');

        (async () => {
            const browser = await puppeteer.launch({
                headless: true,
                args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            
            console.log('海外浏览器正在启动并顺着短链点入目标页面...');
            
            // 监听所有的网络请求，一旦发现包含真实数据流的底层连接，立刻捕捉它
            page.on('request', request => {
                const url = request.url();
                if (url.includes('download.aspx') || url.includes('://1drv.com') || url.includes('downloadUrl')) {
                    console.log('🎯 成功在幕后捕获物理流终极直链:', url);
                    fs.writeFileSync('target_link.txt', url);
                }
            });

            // 顺着你的短链接去敲门
            await page.goto('https://1drv.ms', {
                waitUntil: 'networkidle2',
                timeout: 60000
            });

            await browser.close();
        })();
        EOF

        node spider.js

        # 检查是否成功捕捉到直链，并使用流式工具以高达数百兆的速度拉取真实物理包
        if [ -f target_link.txt ]; then
            REAL_URL=$(cat target_link.txt)
            echo "正在全速拉取真实的物理数据压缩包..."
            curl -L -A "Mozilla/5.0" --retry 5 -o ./dataset_download/sc_depth_dataset.zip "$REAL_URL"
        else
            echo "未捕获到高级直链，启动二级备用方案顺藤摸瓜..."
            FINAL_REDIRECT=$(curl -sIL -o /dev/null -w %{url_effective} "https://1drv.ms")
            BACKUP_URL="${FINAL_REDIRECT/\?/\?download=1&}"
            curl -L -A "Mozilla/5.0" --retry 5 -o ./dataset_download/sc_depth_dataset.zip "$BACKUP_URL"
        fi

        echo "======================================"
        echo "正在校验最终下载包大小（如果显示为几M或者几个G则大功告成）："
        ls -lh ./dataset_download/sc_depth_dataset.zip
        echo "======================================"

    - name: Upload Real Dataset to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v8.0.0-final-pass
        name: SC-Depth Preprocessed Dataset (Browser Verified)
        draft: false
        prerelease: false
        files: ./dataset_download/sc_depth_dataset.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
