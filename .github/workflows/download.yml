name: onedrive-download
on: workflow_dispatch

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - name: Create output dir
      run: mkdir -p out

    - name: Download via onedrive.live.com/download
      run: |
        curl -L --fail --globoff -o out/dataset.bin \
          "https://onedrive.live.com/download?resid=36712431A95E7A25%213265&e=RxOheF" \
          --user-agent "Mozilla/5.0"
        echo "---- file type ----"
        file out/dataset.bin
        ls -lh out

    - name: If empty/HTML, try original URL with download=1
      if: failure() || ! -s out/dataset.bin || file out/dataset.bin | grep -qi html
      run: |
        curl -L --fail --globoff -o out/dataset.zip \
          "https://onedrive.live.com/:u:/g/personal/36712431A95E7A25/s!AiV6XqkxJHE2mUFwH6FrHGCuh_y6?resid=36712431A95E7A25%213265&e=RxOheF&download=1" \
          --user-agent "Mozilla/5.0"
        file out/dataset.zip
        ls -lh out

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        tag_name: onedrive-fetch
        files: out/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
